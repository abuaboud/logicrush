name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:deps
      - run: npm run check:structure
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # E2E: the server seeds its own in-memory PGlite on boot (E2E_SEED=1), so
      # there is no separate seed step and no data dir to hand off between
      # processes -- the whole run lives in the one dev-server process.
      - run: npm run test:e2e
        env:
          E2E_SEED: '1'
          AUTH_SECRET: ci-secret
          NODE_ENV: test
