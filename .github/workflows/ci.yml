name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:deps
      - run: npm run check:structure
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # E2E: seed and the dev server run from different cwds, so the PGlite data
      # dir must be an absolute path they both open (sequentially -- PGlite is
      # single-connection).
      - run: npm run test:e2e:seed
        env:
          PGLITE_DATA_DIR: /tmp/lr-e2e-pgdata
      - run: npm run test:e2e
        env:
          PGLITE_DATA_DIR: /tmp/lr-e2e-pgdata
          AUTH_SECRET: ci-secret
          NODE_ENV: test
